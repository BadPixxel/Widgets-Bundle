################################################################################
widget:
    type:           Type de Widget
    name:           Nom du Widget
    params:         Paramètres
    add:            Ajouter
    view:           Voir
    edit:           Editer
    save:           Sauvegarder
    loading:        "Chargement..."

################################################################################
#    Widget Generic Actions
################################################################################
actions:
    yes:            Oui
    no:             Non
    close:          Fermer
    move:           Déplacer ce widget
    move-left:      Gauche
    move-right:     Droite

remove:
    label:          Supprimer
