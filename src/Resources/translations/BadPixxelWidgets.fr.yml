    contents:       Voulez-vous vraiment supprimer ce widget?
            
################################################################################
#    Options Form Translations
################################################################################
options:
    label:          Affichage
    width:
        label:      Largeur
        tooltip:    "Sélectionnez la largeur de votre widget et nous l'ajusterons sur tous les appareils."
        xs:         Extra Small !! - 25% sur grands écrans
        sm:         Small - 33% sur grands écrans
        m:          Medium (Default) - 50% sur grands écrans
        l:          Large - 66% sur grands écrans
        xl:         Extra Large - Toujours 100%
    color:
        label:      Couleur
        tooltip:    Sélectionnez la couleur du widget
        none:       Aucune (Pas de bordure)
        default:    Défaut
        primary:    Principale
        success:    Succès
        info:       Information
        warning:    Attention
        danger:     Danger
    header:
        label:      Afficher le titre
        tooltip:    Désactivez cette option pour ne pas afficher le titre du widget
    footer:
        label:      Afficher le footer
        tooltip:    Désactivez cette option pour ne pas afficher le bloc du bas du widget
    usecache:
        label:      Utiliser le Cache
        tooltip:    Désactivez cette option pour ne pas stocker le contenu du widget en cache
 
