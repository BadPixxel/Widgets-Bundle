################################################################################
# Docker Compose File
#
# This Docker File intend to Create a Complete Widget Environment
# for Development or Tests of Widget Bundle
#
# One file per image in docker/, vendor & var are dedicated volumes per container:
# local sources are shared, dependencies are installed by each container.
#
# You can add hosts to /etc/hosts
#
# 172.205.1.10          app.widgets.local
# 172.205.1.64          sf6.widgets.local
# 172.205.1.74          sf7.widgets.local
# 172.205.1.84          sf8.widgets.local
#
################################################################################

name: "badpixxel-widgets"

################################################################################
# Multi-versions Dev Services
include:
    - docker/develop.yaml
    - docker/symfony-6.yaml
    - docker/symfony-7.yaml
    - docker/symfony-8.yaml

################################################################################
# Default Private Network
networks:
    widgets:
        driver: bridge
        ipam:
            config:
                - subnet: 172.205.1.0/24
