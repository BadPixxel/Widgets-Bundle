<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <title>Widgets Bundle</title>
    <style>
        .base   { fill: #455a64; }
        .soft   { fill: #b8c4ca; }
        .accent { fill: #7048e8; }
        .glyph  { fill: none; stroke: #ffffff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
        .glyph-fill { fill: #ffffff; }
        @media (prefers-color-scheme: dark) {
            .base { fill: #cfdde4; }
            .soft { fill: #4c6470; }
        }
    </style>
    <rect class="base"   x="4"  y="4"  width="34" height="24" rx="5"/>
    <rect class="soft"   x="42" y="4"  width="18" height="24" rx="5"/>
    <rect class="soft"   x="4"  y="32" width="18" height="28" rx="5"/>
    <rect class="accent" x="26" y="32" width="34" height="28" rx="5"/>
    <rect class="glyph-fill" x="32"   y="47" width="5" height="7"  rx="1.5"/>
    <rect class="glyph-fill" x="40.5" y="42" width="5" height="12" rx="1.5"/>
    <rect class="glyph-fill" x="49"   y="38" width="5" height="16" rx="1.5"/>
</svg>
