services:

    ################################################################################
    # Symfony 6.4 + PHP 8.2
    sf6:
        image:          "registry.gitlab.com/badpixxel-projects/php-sdk:php-8.2"
        init:           true
        container_name: sf6.widgets.local
        hostname:       sf6.widgets.local
        volumes:
            - ../:/var/www/html
            - sf6-var:/var/www/html/var
            - sf6-vendor:/var/www/html/vendor
        environment:
            SERVER_ROOT:        /var/www/html/tests/public
            SYMFONY_REQUIRE:    6.4.*
        networks:
            widgets:            { ipv4_address: 172.205.1.64, aliases: [ sf6.widgets.local ] }

volumes:
    sf6-var:         ~
    sf6-vendor:      ~
