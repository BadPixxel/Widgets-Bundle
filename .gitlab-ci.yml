################################################################
# Set any variables we need
variables:
  COMPOSER_MEMORY_LIMIT:        -1
  SYMFONY_DEPRECATIONS_HELPER:  disabled

################################################################
# Defined Pipeline Stages
stages:
  - Symfony-6
  - Symfony-7
  - Symfony-8
#  - Builds


################################################################
# Functional Tests
################################################################

.core_tests:    &core_tests
    stage:      tests
    tags:
        - Dedicated
    artifacts:
        when: always
        reports:
            junit: "$CI_PROJECT_DIR/*-report.xml"
    ################################################################################
    # Install Dependencies: Flex restricts Symfony to SYMFONY_REQUIRE,
    # composer auto-scripts build the cache, assets & SQLite database
    before_script:
        - composer update --no-interaction --no-progress

    ################################################################################
    # Run Test Suites, same steps as "make verify" in local containers
    script:
        - make quality
        - php vendor/bin/phpunit --log-junit $CI_PROJECT_DIR/test-report.xml

    ################################################################################
    # Outdated Packages & Statistics
    after_script:
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/3.0/ci/after.sh | sh

################################################################
# Symfony 8 (PHP 8.4+)
################################################################

sf8:php-8.5:
    <<: *core_tests
    stage:            Symfony-8
    image:            registry.gitlab.com/badpixxel-projects/php-sdk:php-8.5
    variables:
        SYMFONY_REQUIRE: 8.0.*

sf8:php-8.4:
    <<: *core_tests
    stage:            Symfony-8
    image:            registry.gitlab.com/badpixxel-projects/php-sdk:php-8.4
    variables:
        SYMFONY_REQUIRE: 8.0.*

